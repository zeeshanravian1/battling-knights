# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# ---------------------------------------------------------------------------
# General git checks (offline, zero-setup "builtin" hooks where available)
# ---------------------------------------------------------------------------
[[repos]]
repo = "builtin"
hooks = [
  # Prevents committing large files that can slow down repository
  # performance, ensuring repo stays lightweight and manageable.
  { id = "check-added-large-files", args = ["--maxkb=2048"] },

  # Detects filename conflicts that arise due to case-insensitive
  # filesystems, preventing issues in cross-platform projects.
  { id = "check-case-conflict" },

  # Removes unnecessary whitespace at end of lines, improving code
  # readability and preventing potential issues in certain editors.
  { id = "trailing-whitespace" },

  # Ensures files end with a newline, providing consistency across
  # codebases and conforming to POSIX standards for better
  # interoperability.
  { id = "end-of-file-fixer" },

  # Checks for UTF-8 byte order marker (BOM) in files, preventing
  # potential issues with BOMs in Python source files.
  { id = "fix-byte-order-marker" },

  # Checks for merge conflicts in repository, preventing accidental
  # merge conflicts from being committed.
  { id = "check-merge-conflict" },

  # Verifies that scripts with a shebang are marked as executable,
  # ensuring proper script execution in Unix-based systems.
  { id = "check-shebang-scripts-are-executable" },

  # Checks for symlinks which do not point to anything. This can
  # happen when the target of a symlink is removed.
  { id = "check-symlinks" },

  # Detects symlinks which are changed to regular files with a
  # content of a path which that symlink was pointing to. This
  # usually happens on Windows when a user clones a repository that
  # has symlinks but does not have permission to create symlinks.
  { id = "destroyed-symlinks" },

  # Checks for UTF-8 byte order marker in files.
  { id = "check-yaml" },

  # Attempts to load all TOML files to verify syntax.
  { id = "check-toml" },
]

# ---------------------------------------------------------------------------
# pre-commit-hooks: checks not (yet) covered by the builtin set above
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  # Attempts to load all json files to verify syntax.
  { id = "check-json" },

  # Checks that all your JSON files are pretty. "Pretty" here means
  # that keys are sorted and indented.
  { id = "pretty-format-json", args = ["--autofix"] },

  # Check for debugger imports and py37+ breakpoint() calls in
  # python source.
  { id = "debug-statements" },

  # Simply check whether files parse as valid python.
  { id = "check-ast" },

  # Attempts to load all xml files to verify syntax.
  { id = "check-xml" },

  # Sorts Python package requirements in a requirements.txt file
  # alphabetically, improving readability and simplifying dependency
  # management.
  { id = "requirements-txt-fixer" },

  # Identifies accidentally committed private keys, protecting
  # sensitive information from being exposed in public repositories.
  { id = "detect-private-key" },

  # Verifies that test files are named correctly. Files should be
  # named test_*.py (--pytest-test-first).
  { id = "name-tests-test", args = ["--pytest-test-first"] },
]

# ---------------------------------------------------------------------------
# pyupgrade: automatically upgrade syntax for newer versions of the language.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.21.2"
hooks = [{ id = "pyupgrade" }]

# ---------------------------------------------------------------------------
# black: enforces a consistent code formatting style throughout the project,
# improving code readability and reducing formatting-related discussions
# during code reviews.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/psf/black"
rev = "26.5.1"
hooks = [
  { id = "black", args = ["--line-length", "79"], language_version = "python3.14" },
]

# ---------------------------------------------------------------------------
# flake8: checks Python code for adherence to PEP 8 style guidelines,
# potential programming errors, and code complexity, helping maintain code
# quality.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/pycqa/flake8"
rev = "7.1.2"
hooks = [
  {
    id = "flake8",
    exclude = ".git,__pycache__",
    language_version = "python3.14",
    args = ["--extend-ignore=E203"],
  },
]

# ---------------------------------------------------------------------------
# ruff: automatically formats and lints Python code to conform to PEP 8,
# improving code readability and consistency.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  # Run linter.
  { id = "ruff-check" },
  # Run formatter.
  { id = "ruff-format", args = ["--line-length", "79"] },
]

# ---------------------------------------------------------------------------
# pyright: checks Python code for type hints and type errors, ensuring code
# is correctly annotated and free of type-related issues.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/RobertCraigie/pyright-python"
rev = "v1.1.414"
hooks = [{ id = "pyright", language = "system" }]

# ---------------------------------------------------------------------------
# skjold: scans Python dependencies for known security vulnerabilities,
# alerting developers to potential risks and helping ensure a secure
# application.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/twu/skjold"
rev = "v0.6.2"
hooks = [{ id = "skjold" }]

# ---------------------------------------------------------------------------
# bandit: finds common security issues in Python code, helping ensure secure
# code practices and prevent security vulnerabilities.
# ---------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "1.9.4"

[[repos.hooks]]
id = "bandit"
name = "bandit"
description = "Bandit is a tool for finding common security issues in Python code"
entry = "bandit"
language = "python"
language_version = "python3"
types = ["python"]
require_serial = true
exclude = "tests/"

# ---------------------------------------------------------------------------
# Local tools
# ---------------------------------------------------------------------------
[[repos]]
repo = "local"

# Analyzes Python code complexity using Radon, ensuring that code meets a
# specified complexity threshold before allowing commits, promoting
# maintainable and readable code.
[[repos.hooks]]
id = "radon-check"
name = "radon-check"
language = "system"
entry = "./scripts/radon_check.sh"
types = ["python"]
stages = ["pre-commit"]
pass_filenames = false
verbose = true
