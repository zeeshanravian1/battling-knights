[project]
name = "battling-knights"
version = "0.1.0"
description = "Battling Knights Assessment"
readme = "README.md"
authors = [{ name = "Zeeshan Asim", email = "zeeshanravian1@gmail.com" }]

requires-python = ">=3.14"

dependencies = []

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "httpie>=3.2.4",
  "jupyter>=1.1.1",
  "prek>=0.5.3",
  "pyrefly>=1.3.0",
  "pyright>=1.1.414",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-json-report>=1.5.0",
  "python-lsp-server[all]>=1.15.0",
  "pyupgrade>=3.21.2",
  "radon>=6.0.1",
  "ruff>=0.16.7",
  "skjold>=0.6.2",
  "ty>=0.0.80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG001",  # unused arguments in functions
  "T201",  # print statements are not allowed
  "RUF",  # ruff dev's own rules
  "SIM",  # pyflakes simplicity
  "C90",  # more complexity rules
  "TC",  # typing imports
  "ASYNC",  # async correctness
  "PERF",  # performance
]
ignore = [
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "W191",  # indentation contains tabs
  "B904",  # allow raising exceptions without from e, for HTTPException
  "EXE002"  # shebang-missing-executable-file, handled by pre-commit hook
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.skjold]
sources = ["pyup"]  # Sources to check against.
report_only = false  # Report only, always exit with zero.
report_format = "cli"  # Output findings as `json`. Default is 'cli'.
cache_dir = ".skjold_cache"  # Cache location (default: `~/.skjold/cache`).
cache_expires = 86400  # Cache max. age.
ignore_file = ".skjoldignore"  # Ignorefile location (default `.skjoldignore`).
verbose = true

[tool.ty.terminal]
error-on-warning = true
